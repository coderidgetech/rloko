# Local full-stack test (dev mode): api + web + mongo, built from the local submodules.
# Run:  docker compose -f docker-compose.local.yml up -d --build
# Web:  http://localhost:8088    API: http://localhost:8080/api
name: rloko-local

networks:
  rloko-local:
    driver: bridge

volumes:
  mongo_local: {}

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "28017:27017" # host access for seeding
    volumes:
      - mongo_local:/data/db
    networks: [rloko-local]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    env_file:
      - ./.env.local.secrets
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENV: development # dev mode: CORS open, no prod JWT/rate-limit requirements
      PORT: "8080"
      MONGODB_URI: mongodb://admin:password@mongo:27017/rloco?authSource=admin
      JWT_SECRET: local-dev-secret
      # Leave empty: dev mode echoes the request Origin, which is required for
      # withCredentials requests (Allow-Origin:* + credentials is rejected by browsers).
      CORS_ALLOWED_ORIGINS: ""
      STORAGE_TYPE: local
      APP_BASE_URL: http://localhost:8088
    ports:
      - "8080:8080"
    networks: [rloko-local]
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "8088:80"
    networks: [rloko-local]
    depends_on:
      - api
